databases:
  - name: hostel-management-db
    plan: free
    databaseName: hostel_management
    user: hostel_user

services:
  - type: web
    name: hostel-management
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --noinput && python manage.py bootstrap_admin
    startCommand: gunicorn hostelman.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-management-db
          property: connectionString
