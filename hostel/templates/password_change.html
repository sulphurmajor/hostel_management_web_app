{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Change password | HostelWeb{% endblock %}
{% block content %}
<main class="container py-5">
    <section class="card p-4 p-md-5 mx-auto login-card">
        <h1 class="page-heading h2">Change password</h1>
        <p class="text-muted">Enter your current password, then choose a new one.</p>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-primary w-100" type="submit">Update password</button>
        </form>
        <a class="mt-3 text-center" href="{% url 'index_view' %}">Back to dashboard</a>
    </section>
</main>
{% endblock %}
