{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Edit {{ title }} | HostelWeb{% endblock %}
{% block content %}
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-heading h2 mb-0">Edit {{ title|slice:":-1" }}</h1>
        <a class="btn btn-outline-secondary" href="{% url 'index_view' %}">Home</a>
    </div>
    {% if success_message %}<div class="alert alert-success" role="status">{{ success_message }}</div>{% endif %}
    <section class="card p-4">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-primary" type="submit">Save changes</button>
            <a class="btn btn-outline-secondary" href="{% url 'entity_manage' entity=entity %}">Cancel</a>
        </form>
    </section>
</main>
{% endblock %}
