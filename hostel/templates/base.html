{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HostelWeb{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/hostelweb.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index_view' %}">HostelWeb</a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <div class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                    <a class="nav-link" href="{% url 'student_form' %}">Students</a>
                    <a class="nav-link" href="{% url 'hostel_form' %}">Hostels</a>
                    <a class="nav-link" href="{% url 'warden_form' %}">Wardens</a>
                    <a class="nav-link" href="{% url 'room_form' %}">Rooms</a>
                    <a class="nav-link" href="{% url 'payments_view' %}">Payments</a>
                    <a class="nav-link" href="{% url 'visitor_form' %}">Visitors</a>
                    <span class="navbar-text text-white-50 px-3">{{ user.username }}</span>
                    <form class="d-flex" method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-light btn-sm" type="submit">Sign out</button>
                    </form>
                    {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Sign in</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
